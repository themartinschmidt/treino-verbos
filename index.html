<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08775b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Verbos BR</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#17221f;font:16px Arial,sans-serif}header{padding:16px 5%;background:white;border-bottom:1px solid #dde5e1;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.card{background:white;border:1px solid #dde5e1;border-radius:20px;padding:20px;margin-bottom:15px}h1{font-size:36px}button,input{font:inherit}button{cursor:pointer}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opt{padding:11px;border:1px solid #ccd6d1;border-radius:12px;background:white}.on{border-color:#08775b;background:#eaf7f2}.primary{width:100%;padding:15px;border:0;border-radius:15px;background:#08775b;color:white;font-weight:bold}#list{max-height:650px;overflow:auto}.verb{display:flex;padding:10px;border-radius:10px;gap:10px}.verb:hover{background:#f4f7f5}.verb span:nth-child(2){flex:1}.muted{color:#68756f}.hidden{display:none}.quiz{max-width:680px;margin:auto}.center{text-align:center;padding:35px 0}#inf{font-size:42px;margin:16px}#ans{width:100%;padding:15px;border:2px solid #ccd6d1;border-radius:15px}#feedback{padding:15px;border-radius:15px;background:#eaf7f2;margin-top:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}h1{font-size:31px}}
</style></head><body><header><b>PT · Treino de Verbos</b><button id="back" class="hidden">Einstellungen</button></header><main><section id="setup" class="grid"><div><h1>Portugiesische Verben gezielt üben.</h1><div class="card"><b>Zeitformen</b><div id="times" class="opts"></div></div><div class="card"><b>Personen</b><div id="persons" class="opts"></div></div><div class="card"><b>Verben <span id="cnt"></span></b><div><button id="all">Alle</button> <button id="top">Top 20</button> <button id="none">Keine</button></div></div><button id="start" class="primary">Training starten</button></div><div class="card"><input id="search" placeholder="Verb suchen" style="width:100%;padding:12px"><div id="list"></div></div></section><section id="learn" class="quiz hidden"><div class="card"><div id="meta" class="muted"></div><div class="center"><div>Konjugiere für</div><h2 id="person"></h2><div id="inf"></div><button id="hint">Übersetzung & Lösung</button></div><input id="ans" placeholder="Verbform"><div id="feedback" class="hidden"></div><button id="go" class="primary" style="margin-top:14px">Antwort prüfen</button></div></section></main><script>
const V=`ser:sein,estar:sich befinden,ter:haben,fazer:machen,ir:gehen,poder:können,dizer:sagen,dar:geben,saber:wissen,querer:wollen,chegar:ankommen,passar:verbringen,dever:müssen,ficar:bleiben,deixar:lassen,falar:sprechen,levar:tragen,conhecer:kennen,vir:kommen,pensar:denken,sair:ausgehen,parecer:scheinen,comer:essen,tomar:nehmen,olhar:anschauen,ver:sehen,ouvir:hören,sentir:fühlen,perder:verlieren,ganhar:gewinnen,comprar:kaufen,vender:verkaufen,pagar:bezahlen,trabalhar:arbeiten,estudar:lernen,aprender:lernen,ensinar:beibringen,escrever:schreiben,ler:lesen,abrir:öffnen,fechar:schließen,correr:laufen,andar:gehen,dormir:schlafen,acordar:aufwachen,morar:wohnen,viver:leben,morrer:sterben,nascer:geboren werden,crescer:wachsen,mudar:ändern,voltar:zurückkehren,entrar:eintreten,subir:hinaufgehen,descer:hinuntergehen,pedir:bitten,responder:antworten,perguntar:fragen,ajudar:helfen,precisar:brauchen,gostar:mögen,amar:lieben,odiar:hassen,esperar:warten,lembrar:erinnern,esquecer:vergessen,tentar:versuchen,conseguir:schaffen,usar:benutzen,colocar:stellen,tirar:herausnehmen,pegar:holen,jogar:spielen,brincar:spielen,cantar:singen,dançar:tanzen,nadar:schwimmen,viajar:reisen,dirigir:fahren,cozinhar:kochen,achar:finden,acontecer:geschehen,acabar:beenden,começar:anfangen,terminar:beenden,trazer:bringen,pôr:legen,haver:existieren,chamar:rufen,contar:erzählen,acreditar:glauben,levantar:aufstehen,enviar:senden,parar:anhalten,receber:erhalten,buscar:suchen,seguir:folgen,encontrar:treffen,entender:verstehen,continuar:fortsetzen`.split(',').map((x,i)=>{let p=x.split(':');return{id:i,inf:p[0],de:p.slice(1).join(':')}}),P=[['eu',0],['tu',1],['você',2],['ele / ela',2],['a gente',2],['nós',3],['vós',4],['vocês',5],['eles / elas',5]],T={present:'Gegenwart',past:'Vergangenheit',future:'Zukunft'},IR={ser:[['sou','és','é','somos','sois','são'],['fui','foste','foi','fomos','fostes','foram']],estar:[['estou','estás','está','estamos','estais','estão'],['estive','estiveste','esteve','estivemos','estivestes','estiveram']],ter:[['tenho','tens','tem','temos','tendes','têm'],['tive','tiveste','teve','tivemos','tivestes','tiveram']],fazer:[['faço','fazes','faz','fazemos','fazeis','fazem'],['fiz','fizeste','fez','fizemos','fizestes','fizeram']],ir:[['vou','vais','vai','vamos','ides','vão'],['fui','foste','foi','fomos','fostes','foram']],poder:[['posso','podes','pode','podemos','podeis','podem'],['pude','pudeste','pôde','pudemos','pudestes','puderam']],dizer:[['digo','dizes','diz','dizemos','dizeis','dizem'],['disse','disseste','disse','dissemos','dissestes','disseram']],dar:[['dou','dás','dá','damos','dais','dão'],['dei','deste','deu','demos','destes','deram']],saber:[['sei','sabes','sabe','sabemos','sabeis','sabem'],['soube','soubeste','soube','soubemos','soubestes','souberam']],querer:[['quero','queres','quer','queremos','quereis','querem'],['quis','quiseste','quis','quisemos','quisestes','quiseram']],vir:[['venho','vens','vem','vimos','vindes','vêm'],['vim','vieste','veio','viemos','viestes','vieram']],ver:[['vejo','vês','vê','vemos','vedes','veem'],['vi','viste','viu','vimos','vistes','viram']],trazer:[['trago','trazes','traz','trazemos','trazeis','trazem'],['trouxe','trouxeste','trouxe','trouxemos','trouxestes','trouxeram']],pôr:[['ponho','pões','põe','pomos','pondes','põem'],['pus','puseste','pôs','pusemos','pusestes','puseram']]};
let S={times:['present'],persons:P.map((_,i)=>i).filter(i=>i!=6),verbs:V.map(v=>v.id),box:JSON.parse(localStorage.getItem('verbos-box')||'{}'),q:null,shown:false}; const $=x=>document.getElementById(x),norm=x=>x.toLowerCase().trim().normalize('NFD').replace(/[̀-ͯ]/g,'');
function reg(v,t){let e=v.slice(-2),s=v.slice(0,-2),a=t==='present'?(e==='ar'?['o','as','a','amos','ais','am']:e==='er'?['o','es','e','emos','eis','em']:['o','es','e','imos','is','em']):(e==='ar'?['ei','aste','ou','amos','astes','aram']:e==='er'?['i','este','eu','emos','estes','eram']:['i','iste','iu','imos','istes','iram']);return a.map(x=>s+x)}function forms(v,t){if(t==='future')return IR.ir[0].map(x=>x+' '+v);return IR[v]?.[t==='present'?0:1]||reg(v,t)}
function render(){$('times').innerHTML=Object.entries(T).map(x=>`<button class="opt ${S.times.includes(x[0])?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('');$('persons').innerHTML=P.map((x,i)=>`<button class="opt ${S.persons.includes(i)?'on':''}" data-p="${i}">${x[0]}</button>`).join('');list()}function list(){let q=$('search').value.toLowerCase();$('cnt').textContent=`${S.verbs.length}/100`;$('list').innerHTML=V.filter(v=>(v.inf+v.de).includes(q)).map(v=>`<label class="verb"><input type="checkbox" data-v="${v.id}" ${S.verbs.includes(v.id)?'checked':''}><span><b>${v.inf}</b></span><span class="muted">${v.de}</span></label>`).join('')}
document.onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.t)S.times=S.times.includes(b.dataset.t)?S.times.filter(x=>x!=b.dataset.t):[...S.times,b.dataset.t];if(b.dataset.p!==undefined){let n=+b.dataset.p;S.persons=S.persons.includes(n)?S.persons.filter(x=>x!=n):[...S.persons,n]}render()};document.onchange=e=>{if(e.target.dataset.v!==undefined){let n=+e.target.dataset.v;S.verbs=e.target.checked?[...S.verbs,n]:S.verbs.filter(x=>x!=n);list()}};$('search').oninput=list;$('all').onclick=()=>{S.verbs=V.map(v=>v.id);list()};$('none').onclick=()=>{S.verbs=[];list()};$('top').onclick=()=>{S.verbs=V.slice(0,20).map(v=>v.id);list()};
function next(){let vs=V.filter(v=>S.verbs.includes(v.id)),v=vs[Math.floor(Math.random()*vs.length)],pi=S.persons[Math.floor(Math.random()*S.persons.length)],t=S.times[Math.floor(Math.random()*S.times.length)];S.q={v,pi,t};S.shown=false;$('ans').value='';$('feedback').classList.add('hidden');$('go').textContent='Antwort prüfen';$('meta').textContent=T[t]+' · Box '+(S.box[v.id]||1);$('person').textContent=P[pi][0];$('inf').textContent=v.inf;$('ans').focus()}function reveal(good){let q=S.q,a=forms(q.v.inf,q.t)[P[q.pi][1]];S.shown=true;$('feedback').innerHTML=`<b>${P[q.pi][0].split(' /')[0]} ${a}</b><br><span class="muted">${q.v.de} · ${T[q.t]}</span>`;$('feedback').classList.remove('hidden');$('go').textContent='Nächste Aufgabe';if(good!==undefined){S.box[q.v.id]=Math.max(1,Math.min(5,(S.box[q.v.id]||1)+(good?1:-1)));localStorage.setItem('verbos-box',JSON.stringify(S.box))}}function check(){let q=S.q,a=forms(q.v.inf,q.t)[P[q.pi][1]],v=norm($('ans').value),good=v===norm(a)||v===norm(P[q.pi][0].split(' /')[0]+' '+a);reveal(good)}
$('start').onclick=()=>{if(!S.times.length||!S.persons.length||!S.verbs.length)return; $('setup').classList.add('hidden');$('learn').classList.remove('hidden');$('back').classList.remove('hidden');next()};$('back').onclick=()=>{$('setup').classList.remove('hidden');$('learn').classList.add('hidden');$('back').classList.add('hidden')};$('go').onclick=()=>S.shown?next():check();$('hint').onclick=()=>reveal();$('ans').onkeydown=e=>{if(e.key==='Enter')S.shown?next():check()};render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
